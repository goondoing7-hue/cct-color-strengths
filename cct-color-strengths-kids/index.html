<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>청소년 컬러 강점 검사 · CCT</title>
<meta name="description" content="39개의 질문으로 나의 13가지 컬러 강점을 알아보는 CCT 청소년 버전." />
<meta name="theme-color" content="#171227" />

<!-- Open Graph (카카오톡 등 링크 미리보기용) -->
<meta property="og:title" content="청소년 컬러 강점 검사 · CCT" />
<meta property="og:description" content="39개의 질문으로 알아보는 나의 13가지 컬러 강점" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/goondoing7-hue/cct-color-strengths@main/cct-color-strengths-kids/assets/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="청소년 컬러 강점 검사 - 13가지 컬러 강점 찾기" />
<meta property="og:site_name" content="CCT 컬러성격강점검사" />
<meta property="og:locale" content="ko_KR" />

<!-- Twitter Card (일부 미리보기 서비스가 참고) -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="청소년 컬러 강점 검사 · CCT" />
<meta name="twitter:description" content="39개의 질문으로 알아보는 나의 13가지 컬러 강점" />
<meta name="twitter:image" content="https://cdn.jsdelivr.net/gh/goondoing7-hue/cct-color-strengths@main/cct-color-strengths-kids/assets/og-image.png" />

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- ================= INTRO ================= -->
  <section id="screen-intro" class="screen screen--intro is-active">
    <div class="intro-bg" aria-hidden="true"></div>

    <div class="intro-content">
      <div class="brand-kicker bk-teen"><span class="bk-tag">CCT</span><span class="bk-txt">청소년 컬러 강점 검사</span></div>

      <div class="color-ring" id="colorRing" aria-hidden="true"></div>

      <h1 class="intro-title">나에게 숨어 있는<br />13가지 컬러 강점 찾기</h1>
      <p class="intro-sub">
        평소의 내 모습을 떠올리며 질문에 답하면<br class="brOnly" />
        내가 자주 쓰는 컬러 강점을 알려 줘요.
      </p>

      <div class="intro-meta">
        <div class="meta-chip"><span class="meta-num">39</span><span class="meta-label">문항</span></div>
        <div class="meta-chip"><span class="meta-num">7</span><span class="meta-label">분</span></div>
        <div class="meta-chip"><span class="meta-num">13</span><span class="meta-label">컬러 강점</span></div>
      </div>

      <div class="intro-name-field">
        <label for="userName">내 이름 <span class="required">(꼭 써 주세요)</span></label>
        <input type="text" id="userName" maxlength="12" placeholder="이름을 써 주세요" />
      </div>

      <div class="access-field">
        <label for="accessCode">입장 코드</label>
        <input type="password" id="accessCode" maxlength="24" placeholder="선생님이 알려 준 코드" autocomplete="off" />
        <div class="access-status" id="accessStatus"></div>
      </div>

      <button class="btn btn-primary btn-start" id="btnStart" disabled>
        시작하기
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <p class="intro-fineprint">
        정답은 없어요. 잘 보이려고 하기보다 평소의 나와 가장 비슷한 답을 골라 주세요.
        이 검사는 시험이 아니고, 좋고 나쁜 컬러도 없어요. 누구에게나 여러 가지 컬러 강점이 있어요.
      </p>
      <p class="app-ver">kids_19 · 2026.11.17 · 청소년 버전</p>
    </div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section id="screen-quiz" class="screen screen--quiz">
    <header class="quiz-header">
      <button class="icon-btn" id="btnBack" aria-label="이전 문항">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-count"><span id="qNum">1</span> / <span id="qTotal">39</span></div>
    </header>

    <div class="quiz-body">
      <div class="quiz-card" id="quizCard">
        <p class="quiz-question" id="quizQuestion">문항이 여기에 표시됩니다.</p>
        <div class="quiz-scale" id="quizScale"></div>
      </div>
    </div>
  </section>

  <!-- ================= RESULT ================= -->
  <section id="screen-result" class="screen screen--result">
    <div class="result-wrap" id="resultWrap">
      <!-- JS가 이 안에 결과 콘텐츠를 채웁니다 -->
    </div>
  </section>

</div>

<script src="js/vendor/html2canvas.min.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/cct-rank.js"></script>
<script src="js/cct-interp.js"></script>
<script src="js/kids-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
